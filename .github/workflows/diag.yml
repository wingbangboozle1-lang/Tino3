name: CI diagnose
on:
  push:
    branches: [arena/cd0dd59b-tino3]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and show any output
        run: |
          python -V
          python scripts/verify.py; echo "exit=$?"
          git status --porcelain; git diff --stat | tail -5
