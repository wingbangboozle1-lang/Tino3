name: CI diagnose
on:
  push:
    branches: [arena/cd0dd59b-tino3]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify, and publish the failure as an annotation
        run: |
          set +e
          out=$(python scripts/verify.py 2>&1; echo "exit=$?")
          echo "$out"
          if echo "$out" | grep -qv "exit=0"; then
            safe=$(echo "$out" | head -c 4000 | tr '\n' '~' | sed 's/%/%25/g; s/\r//g')
            echo "::error title=verify.py output::$safe"
          fi
