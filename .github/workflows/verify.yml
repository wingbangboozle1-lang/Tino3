name: Verify static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild the model and public site from source inputs
        run: python scripts/rebuild.py
      - name: Verify sources, links, rounding and privacy
        run: |
          set -o pipefail
          if ! python scripts/verify.py 2>&1 | tee /tmp/verify.txt; then
            while IFS= read -r line; do echo "::error title=verify.py::$line"; done < /tmp/verify.txt
            exit 1
          fi
      - name: Privacy boundary
        run: python scripts/privacy_boundary.py
      - name: Tracked-tree identifier guard
        run: python scripts/tracked_tree_guard.py
      - name: Build the Actions artifact
        run: python scripts/package_site.py
      - name: Generated outputs are not stale
        run: |
          paths=( '*.html' EXECUTIVE_SUMMARY.md assets/data/model.json assets/data/economy.json assets/data/mixed.json assets/data/liquidity.json assets/data/property_a.csv assets/data/property_b.csv assets/data/decision.csv )
          if ! git diff --quiet HEAD -- "${paths[@]}"; then
            git --no-pager diff --stat HEAD -- "${paths[@]}"
            echo "::error::committed generated outputs differ from a fresh rebuild; run scripts/rebuild.py and commit the derived files"
            exit 1
          fi
      - name: Check the legacy source boundary
        run: python scripts/verify_legacy.py --config-only
      - name: Build the legacy Jekyll publication (the live publisher)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_legacy_site
      - name: Audit actual Jekyll output
        run: python scripts/verify_legacy.py --site _legacy_site
