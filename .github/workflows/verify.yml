name: Verify static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the public pages from data and the source ledger
        run: python scripts/build.py
      - name: Verify sources, links, rounding and privacy
        run: python scripts/verify.py
      - name: Privacy boundary
        run: python scripts/privacy_boundary.py
      - name: Build the Actions artifact
        run: python scripts/package_site.py
      - name: Generated pages are not stale
        run: |
          if ! git diff --quiet -- '*.html' assets/data; then
            git --no-pager diff --stat -- '*.html' assets/data
            echo "::error::committed generated pages differ from a fresh build; run scripts/build.py and commit"
            exit 1
          fi
      - name: Check the legacy source boundary
        run: python scripts/verify_legacy.py --config-only
      - name: Build the legacy Jekyll publication (the live publisher)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_legacy_site
      - name: Audit actual Jekyll output
        run: python scripts/verify_legacy.py --site _legacy_site
