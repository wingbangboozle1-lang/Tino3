name: Verify public edition
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public artifact and legacy source boundary
        run: python scripts/verify.py
      - name: Build the branch-source Jekyll publication
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_legacy_site
      - name: Audit actual Jekyll output
        run: python scripts/verify_legacy.py --site _legacy_site
