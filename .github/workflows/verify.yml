name: Verify static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/model.py
      - run: cd scripts && python webbuild.py
      - run: python scripts/verify.py
      - run: python scripts/package_site.py
