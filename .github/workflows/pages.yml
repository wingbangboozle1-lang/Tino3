name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site links and privacy notice
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag=='a':
                      href=d.get('href','')
                      if href.startswith('#'): self.hrefs.append(href[1:])
                      elif href and not href.startswith(('https://','http://','mailto:','javascript:')):
                          target=Path(current).parent / href.split('#')[0]
                          assert target.exists(), f'Broken local link in {current}: {href}'
          pages=sorted(Path('.').glob('*.html'))
          for page in pages:
              current=str(page); check=Check(); check.feed(page.read_text())
              missing=sorted(set(check.hrefs)-check.ids)
              assert not missing, f'Broken anchor(s) in {page}: {missing}'
          assert Path('flagged.html').exists(), 'Missing Flagged for Review page'
          print(f'Validated {len(pages)} pages, internal references, and review page.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
