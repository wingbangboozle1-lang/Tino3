name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild the model and public site from source inputs
        run: python scripts/rebuild.py
      - name: Verify sources, links, rounding and privacy
        run: python scripts/verify.py
      - name: Require committed generated outputs
        run: |
          paths=( '*.html' EXECUTIVE_SUMMARY.md assets/data/model.json assets/data/economy.json assets/data/mixed.json assets/data/liquidity.json assets/data/property_a.csv assets/data/property_b.csv assets/data/decision.csv )
          if ! git diff --quiet HEAD -- "${paths[@]}"; then
            git --no-pager diff --stat HEAD -- "${paths[@]}"
            echo "::error::committed generated outputs differ from a fresh rebuild; refusing to deploy stale or uncommitted results"
            exit 1
          fi
      - run: python scripts/package_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
