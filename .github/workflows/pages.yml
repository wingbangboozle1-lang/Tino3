name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate page links and privacy basics
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag=='a' and d.get('href','').startswith('#'): self.hrefs.append(d['href'][1:])
          p=Path('index.html').read_text(); c=Check(); c.feed(p)
          missing=sorted(set(c.hrefs)-c.ids)
          assert not missing, f'Broken anchor links: {missing}'
          assert 'personal names, parcel numbers, street addresses' in p
          print(f'Validated {len(c.hrefs)} in-page links and privacy notice.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
