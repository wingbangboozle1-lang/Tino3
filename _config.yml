# Safety boundary for GitHub Pages when its source is set to "main / (root)".
# The Actions artifact is published from an explicit allowlist; this configuration and the
# workflow-level check keep the legacy Jekyll publisher from serving anything outside it.
#
# Rules:
#   1. `.nojekyll` must never be committed: it disables these exclusions entirely.
#   2. Nothing may be published by Jekyll that the artifact allowlist would not publish, so every
#      root page and data file not in the allowlist is excluded here as well.
#   3. `scripts/verify.py` asserts that this file matches the expected exclusion set, so deleting
#      an exclusion fails the build instead of quietly exposing a path.
theme: null
exclude:
  - analysis
  - plan
  - scripts
  - assets/data
  - assets/privacy.json
  - assets/sources.json
  - _config.yml
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
  - requirements.txt
