# Safety boundary for GitHub Pages when its source is the repository root.
# The Actions artifact uses a separate allowlist; this excludes all other tracked material
# from the legacy Jekyll publisher until the repository setting can be changed.
theme: null
exclude:
  - analysis
  - plan
  - scripts
  - assets/data
  - assets/privacy.json
  - assets/sources.json
  - black-swans.html
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
